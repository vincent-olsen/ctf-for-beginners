# Extra override for CTFd when hosting behind Microsoft sign-in
# (ctf.sh up --domain <name> --sso-tenant <id> --sso-client-id <id>).
# Caddy asks oauth2-proxy about every request first (CTF_AUTH=sso in the Caddyfile),
# and oauth2-proxy signs visitors in with Entra ID. The app registration is single
# tenant, so only that tenant's accounts get in. CTFd's own accounts are unchanged.
# ctf.sh fills in the secrets from .ctf/ (see docs/azure.md).

services:
  caddy:
    environment:
      - CTF_AUTH=sso
    depends_on: [ctfd, oauth2-proxy]

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
    restart: always
    environment:
      - OAUTH2_PROXY_PROVIDER=entra-id
      - OAUTH2_PROXY_OIDC_ISSUER_URL=https://login.microsoftonline.com/${CTF_SSO_TENANT:?set by ctf.sh}/v2.0
      - OAUTH2_PROXY_CLIENT_ID=${CTF_SSO_CLIENT_ID:?set by ctf.sh}
      - OAUTH2_PROXY_CLIENT_SECRET=${CTF_SSO_CLIENT_SECRET:-}
      - OAUTH2_PROXY_COOKIE_SECRET=${CTF_SSO_COOKIE_SECRET:-}
      - OAUTH2_PROXY_REDIRECT_URL=https://${CTF_DOMAIN:?set by ctf.sh}/oauth2/callback
      - OAUTH2_PROXY_SCOPE=openid email profile
      - OAUTH2_PROXY_EMAIL_DOMAINS=*
      - OAUTH2_PROXY_SKIP_PROVIDER_BUTTON=true
      - OAUTH2_PROXY_COOKIE_NAME=_ctf_sso
      - OAUTH2_PROXY_COOKIE_SECURE=true
      # Caddy's forward_auth only asks "signed in?"; it proxies to CTFd itself.
      - OAUTH2_PROXY_UPSTREAMS=static://202
      - OAUTH2_PROXY_REVERSE_PROXY=true
      - OAUTH2_PROXY_HTTP_ADDRESS=0.0.0.0:4180
