  - "5 | Bokstavene er stokket av et chiffer som bytter ut hver bokstav med en annen fra et tilfeldig sortert alfabet. Prøv å gjette noen vanlige engelske ord, og jobb deg videre derfra. Kanskje du kan begynne med ordet `flag`?"
