name: overflow4(deprecated)
flag: 'flag{brave4_property_slept}'
category: pwn
value: 120
message: |
  Reading the disassembly

  The program hides its flag behind a guard byte again — but this time there are no address prints or leaks.

  You already know that each character you type = 1 byte.  
  To solve this challenge, figure out exactly how many bytes are needed so that the string terminator (`\0`) lands on the guard.

  You have two options: brute force it, or analyze the binary. Here are some free tips:

  * `objdump -d -M intel ./binary`
  * Look for a “suspicious” function, then find the vulnerable call to `scanf("%s", ...)`.

  The information is all there in the disassembly — your job is to spot the buffer, find the guard, and calculate the distance yourself.
message_no: |
  Les disassembleringen

  Programmet gjemmer flagget bak en vaktbyte igjen, men denne gangen skriver det ikke ut noen adresser, og ingenting lekker.

  Du vet allerede at hvert tegn du skriver = 1 byte.  
  For å løse oppgaven må du finne ut nøyaktig hvor mange bytes som trengs for at strengavslutningen (`\0`) havner på vakten.

  Du har to muligheter: prøv deg frem (brute force), eller analyser binærfilen. Her er noen gratis tips:

  * `objdump -d -M intel ./binary`
  * Se etter en «mistenkelig» funksjon, og finn det sårbare kallet til `scanf("%s", ...)`.

  All informasjonen ligger i disassembleringen. Jobben din er å finne bufferen, finne vakten og regne ut avstanden selv.
connection: nc <host> <port>
port: <port>
protocol: tcp
notes: 64-bit ELF. Hit the exact length so the string terminator clears the guard byte.

# hints: paid hints in CTFd, synced from here on ./ctf.sh up (they used to come
# from the imported backup). Format "COST | text"; hints_no holds the same
