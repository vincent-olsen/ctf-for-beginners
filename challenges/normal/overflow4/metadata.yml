hints:
  - |
    5 | From the `objdump -d  ./binary` you can see something like this:

    * `401349:  c6 45 f7 ff`    guard byte at [rbp-0x09]
    * `401361:  lea -0x40(%rbp), %rax`
      `401365:  mov %rax, %rsi` buffer passed to scanf at [rbp-0x40]
    * `401377:  call __isoc99_scanf@plt` scanf("%s", buffer)
    * `40137c:  movzbl -0x9(%rbp), %eax` later: read guard
    * `401380:  test   %al, %al` check if guard == 0

    Does this resemble anything from the previous binary challenges?

    Compute the distance:  
    (rbp-0x??) - (rbp-0x??) = 0x?? 
    Then convert the result to decimal to get the exact number of bytes to enter.
  - |
    5 | Now take that byte length you found in Hint 1 and use it to send the exact input to the remote service (host and port from this challenge's connection info):
    ```
    python3 -c "print('A'*<length>)" | nc <host> <port>
    ```
hints_no:
  - |
    5 | I `objdump -d  ./binary` ser du noe sånt som dette:

    * `401349:  c6 45 f7 ff`    vaktbyte på [rbp-0x09]
    * `401361:  lea -0x40(%rbp), %rax`
      `401365:  mov %rax, %rsi` bufferen som sendes til scanf, på [rbp-0x40]
    * `401377:  call __isoc99_scanf@plt` scanf("%s", buffer)
    * `40137c:  movzbl -0x9(%rbp), %eax` senere: leser vakten
    * `401380:  test   %al, %al` sjekker om vakten == 0

    Minner dette om noe fra de forrige binæroppgavene?

    Regn ut avstanden:  
    (rbp-0x??) - (rbp-0x??) = 0x?? 
    Gjør så om resultatet til desimal for å få nøyaktig antall bytes du skal skrive inn.
  - |
    5 | Ta byte-lengden du fant i hint 1, og bruk den til å sende nøyaktig riktig input til tjenesten (vert og port fra tilkoblingsinfoen til oppgaven):
    ```
    python3 -c "print('A'*<length>)" | nc <host> <port>
