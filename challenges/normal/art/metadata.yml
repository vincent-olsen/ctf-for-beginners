message: |
  Some detective work. Find out:

  1. What's the artist's name? (firstname_lastname)
  2. What year was it drawn? (XXXX)
  3. What's the address of the building it's drawn on? (streetname_streetnumber)

  Note: First and last name only, no middle name. Use "_" if the street name has several words.

  Flag format:
  flag{firstname_lastname_year_streetname_streetnumber}
message_no: |
  Litt detektivarbeid. Finn ut:

  1. Hva heter kunstneren? (fornavn_etternavn)
  2. Hvilket år ble det tegnet? (XXXX)
  3. Hvilken adresse har bygningen det er tegnet på? (gatenavn_gatenummer)

  Merk: Bare fornavn og etternavn, ikke mellomnavn. Bruk "_" hvis gatenavnet har flere ord.

  Flaggformat:
  flag{fornavn_etternavn_årstall_gatenavn_gatenummer}
notes: misc - OSINT / reverse image search

