<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Successful</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #808080; /* Grey background */
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: #71ca63; /* Green color */
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3); /* Shadow effect */
        }
        h1 {
            color: #fff; /* White text */
            margin-bottom: 20px;
        }
        p {
            color: #fff; /* White text */
            margin-bottom: 20px;
        }
        .button {
            background-color: #2c662d; /* Dark green button */
            color: #fff; /* White text */
            border: none;
            border-radius: 4px;
            padding: 10px 20px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .button:hover {
            background-color: #1e451d; /* Darker green on hover */
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Login Successful</h1>
    <p>Welcome back, Admin!</p>
</div>
</body>
</html>
